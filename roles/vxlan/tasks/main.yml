---
- name: Tailscale must be running (VXLAN travels inside it)
  ansible.builtin.systemd:
    name: tailscaled
    enabled: true
    state: started

- name: VXLAN configuration (peer computed from the inventory)
  ansible.builtin.template:
    src: vxlan-lab.conf.j2
    dest: /etc/vxlan-lab.conf
    owner: root
    group: root
    mode: "0644"
  notify: Apply VXLAN

- name: VXLAN script
  ansible.builtin.copy:
    src: vxlan-lab.sh
    dest: /usr/local/sbin/vxlan-lab.sh
    owner: root
    group: root
    mode: "0755"
  notify: Apply VXLAN

- name: VM port re-plug script
  ansible.builtin.copy:
    src: vxlan-replug.sh
    dest: /usr/local/sbin/vxlan-replug.sh
    owner: root
    group: root
    mode: "0755"

- name: VXLAN systemd unit
  ansible.builtin.copy:
    src: vxlan-lab.service
    dest: /etc/systemd/system/vxlan-lab.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Drop-in folders for the boot order
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ item }}.service.d"
    state: directory
    mode: "0755"
  loop: [virtqemud, virtstoraged]

- name: Boot order - VMs start after the VXLAN bridges exist
  ansible.builtin.copy:
    src: virtqemud-10-after-vxlan.conf
    dest: /etc/systemd/system/virtqemud.service.d/10-after-vxlan.conf
    mode: "0644"
  notify: Reload systemd

- name: Boot order - storage pools start after network, Tailscale, NFS and iSCSI
  ansible.builtin.copy:
    src: virtstoraged-10-after-network.conf
    dest: /etc/systemd/system/virtstoraged.service.d/10-after-network.conf
    mode: "0644"
  notify: Reload systemd

- name: Apply pending systemd reloads and file changes now
  ansible.builtin.meta: flush_handlers

- name: VXLAN service enabled and active
  ansible.builtin.systemd:
    name: vxlan-lab
    enabled: true
    state: started

# ---- runtime state: files can be right while the live interfaces are wrong ----
- name: Read each VXLAN interface (live state)
  ansible.builtin.command: ip -d link show vxlan{{ item }}
  register: vxlan_links
  changed_when: false
  failed_when: false
  check_mode: false
  loop: "{{ vxlan_vnis }}"

- name: List the VNIs whose live state differs from the design
  ansible.builtin.set_fact:
    vxlan_bad_vnis: "{{ (vxlan_bad_vnis | default([])) + [item.item] }}"
  when: >-
    item.rc != 0
    or ('mtu ' ~ vxlan_mtu) not in item.stdout
    or ('remote ' ~ vxlan_peer_ip) not in item.stdout
    or ('master br' ~ item.item) not in item.stdout
  loop: "{{ vxlan_links.results }}"
  loop_control:
    label: "vxlan{{ item.item }}"

- name: Report live drift (shows as changed, also in --check)
  ansible.builtin.debug:
    msg: "live drift on: vxlan{{ vxlan_bad_vnis | join(', vxlan') }}"
  changed_when: true
  when: vxlan_bad_vnis | default([]) | length > 0

- name: Repair the live VXLAN state (up recreates missing parts, resets MTU and bridge)
  ansible.builtin.command: /usr/local/sbin/vxlan-lab.sh up
  changed_when: true
  when: vxlan_bad_vnis | default([]) | length > 0

- name: Read each VXLAN interface again
  ansible.builtin.command: ip -d link show vxlan{{ item }}
  register: vxlan_links_after
  changed_when: false
  check_mode: false
  loop: "{{ vxlan_vnis }}"
  when: not ansible_check_mode

- name: Check MTU, peer and bridge of each VXLAN interface
  ansible.builtin.assert:
    that:
      - "('mtu ' ~ vxlan_mtu) in item.stdout"
      - "('remote ' ~ vxlan_peer_ip) in item.stdout"
      - "('master br' ~ item.item) in item.stdout"
    fail_msg: "vxlan{{ item.item }} is not as designed: {{ item.stdout | default('no output') }}"
    quiet: true
  loop: "{{ vxlan_links_after.results }}"
  loop_control:
    label: "vxlan{{ item.item }}"
  when: not ansible_check_mode

- name: Re-plug running VMs' ports into their bridge
  ansible.builtin.command: /usr/local/sbin/vxlan-replug.sh {{ '--dry-run' if ansible_check_mode else '' }}
  register: vxlan_replug
  changed_when: vxlan_replug.stdout | length > 0
  check_mode: false

- name: Show the re-plugged VM ports
  ansible.builtin.debug:
    var: vxlan_replug.stdout_lines
  when: vxlan_replug.stdout | length > 0

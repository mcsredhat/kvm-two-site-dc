---
- name: Initiator package
  ansible.builtin.dnf:
    name: iscsi-initiator-utils
    state: present

- name: Initiator name (must match the ACL on the target)
  ansible.builtin.copy:
    content: "InitiatorName={{ storage_iscsi_iqn_prefix }}:{{ inventory_hostname }}\n"
    dest: /etc/iscsi/initiatorname.iscsi
    mode: "0644"
  notify: Restart iscsid

- name: Service iscsid running
  ansible.builtin.systemd:
    name: iscsid
    enabled: true
    state: started

- name: Apply a new initiator name before discovery
  ansible.builtin.meta: flush_handlers

- name: Read the known iSCSI nodes
  ansible.builtin.command: iscsiadm -m node
  register: nodes
  changed_when: false
  failed_when: nodes.rc not in [0, 21]        # 21 = no records yet
  check_mode: false

- name: Discover the target (only if unknown)
  ansible.builtin.command: iscsiadm -m discovery -t sendtargets -p {{ storage_server_ip }}
  when: storage_iscsi_target_iqn not in nodes.stdout
  changed_when: true

- name: Read the node startup mode
  ansible.builtin.command: >-
    iscsiadm -m node -T {{ storage_iscsi_target_iqn }} -p {{ storage_server_ip }} -o show
  register: node_cfg
  changed_when: false
  check_mode: false
  when: not ansible_check_mode or storage_iscsi_target_iqn in nodes.stdout

- name: Only libvirt logs in (node.startup = manual, avoids the boot race)
  ansible.builtin.command: >-
    iscsiadm -m node -T {{ storage_iscsi_target_iqn }} -p {{ storage_server_ip }}
    --op update -n node.startup -v manual
  when:
    - node_cfg.stdout is defined
    - "'node.startup = manual' not in node_cfg.stdout"
  changed_when: true

- name: Define the iSCSI pool (only if it does not exist)
  community.libvirt.virt_pool:
    command: define
    name: "{{ storage_iscsi_pool_name }}"
    xml: "{{ lookup('ansible.builtin.template', 'iscsipool.xml.j2') }}"

- name: Storage - iSCSI pool started
  community.libvirt.virt_pool:
    name: "{{ storage_iscsi_pool_name }}"
    state: active

- name: Storage - iSCSI pool starts at boot
  community.libvirt.virt_pool:
    name: "{{ storage_iscsi_pool_name }}"
    autostart: true

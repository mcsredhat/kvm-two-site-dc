name: lint
on: [push, pull_request]
jobs:
  ansible-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the same versions as the lab (ansible-core 2.15, ansible-lint 6.22.2)
        run: pip install "ansible-core==2.15.13" "ansible-lint==6.22.2"
      - name: Collections
        run: ansible-galaxy collection install -r collections/requirements.yml
      - name: Lint
        run: ansible-lint site.yml
